services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_DATABASE: project_x
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ALLOW_EMPTY_PASSWORD: "no"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 5s
      retries: 10

  app:
    build: ./BACKEND
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8000:8000"
      - "8080:8080"
    volumes:
      - ./BACKEND:/var/www/html
    environment:
      APP_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:3000
      SANCTUM_STATEFUL_DOMAINS: localhost:3000,localhost:5174
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: project_x
      DB_USERNAME: root
      DB_PASSWORD: root
    command: sh -c "composer install && php artisan migrate --seed && php artisan serve --host=0.0.0.0 --port=8000"

volumes:
  mysql_data:
